<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f7f8">
<title>文章整形ツール</title>
<style>
:root{
  --bg:#f4f5f7; --panel:#ffffff; --panel2:#f8f9fb; --text:#17181a; --muted:#71757d;
  --line:#dedfe3; --accent:#22252a; --accent2:#eef0f3; --danger:#b42318;
  --shadow:0 8px 28px rgba(0,0,0,.06); --radius:18px;
  --accentColor:#5b8def; --accentSoft:rgba(91,141,239,.14); --accentText:#ffffff;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#111214; --panel:#1a1c1f; --panel2:#202328; --text:#f2f3f5; --muted:#a0a5ad;
    --line:#343840; --accent:#f5f6f7; --accent2:#2b2f35; --danger:#ff766f;
    --shadow:0 8px 28px rgba(0,0,0,.20);
    --accentSoft:rgba(255,255,255,.10);
  }
}
*{box-sizing:border-box}
::selection{background:var(--accentSoft)}
html{scroll-behavior:smooth}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic UI","Yu Gothic",Meiryo,sans-serif;
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.app{max-width:1180px;margin:auto;padding:18px 16px 48px}
.header{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:14px}
.brand h1{font-size:22px;margin:0 0 4px}
.brand h1::after{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--accentColor);margin-left:8px;vertical-align:2px;box-shadow:0 0 0 5px var(--accentSoft)}
.brand p{font-size:12px;color:var(--muted);margin:0}
.header-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{
  border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:11px;
  padding:9px 12px;font-weight:700;font-size:13px;box-shadow:none
}
.btn:hover{background:var(--accent2)}
.btn.primary{background:var(--accentColor);color:var(--accentText);border-color:var(--accentColor)}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(310px,.8fr);gap:14px}
.card{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow)
}
.editor-card{overflow:hidden}
.editor-top{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.editor-top strong{font-size:14px}
.editor-tools{display:flex;gap:7px;flex-wrap:wrap}
#editor{
  width:100%;min-height:560px;resize:vertical;border:0;outline:0;background:transparent;color:var(--text);
  padding:18px;font-size:15px;line-height:1.85;tab-size:2
}
.stats{
  border-top:1px solid var(--line);padding:10px 14px;display:grid;grid-template-columns:repeat(6,1fr);gap:8px
}
.stat{min-width:0}
.stat b{display:block;font-size:14px}
.stat span{font-size:11px;color:var(--muted)}
.side{display:flex;flex-direction:column;gap:14px}
.section{padding:14px}
.section h2{font-size:14px;margin:0 0 12px}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tool{
  text-align:left;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:12px;
  padding:10px 11px;font-size:12px;font-weight:700;line-height:1.35
}
.tool small{display:block;color:var(--muted);font-weight:500;margin-top:3px}
.tool:hover{border-color:var(--accentColor);background:var(--accentSoft)}
.input, .select{
  width:100%;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:10px;padding:9px 10px;outline:none
}
.input:focus,.select:focus{border-color:var(--accentColor);box-shadow:0 0 0 3px var(--accentSoft)}
.row{display:flex;gap:8px;align-items:center}
.row>*{min-width:0}
.replace-list{display:flex;flex-direction:column;gap:8px}
.rule{
  display:grid;grid-template-columns:1fr 28px 1fr 30px;gap:6px;align-items:center
}
.arrow{text-align:center;color:var(--muted)}
.iconbtn{
  width:30px;height:34px;border:1px solid var(--line);background:var(--panel2);color:var(--muted);border-radius:9px
}
.options{display:flex;gap:12px;flex-wrap:wrap;margin:10px 0}
.check{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.replace-actions{display:flex;gap:8px}
.notice{font-size:11px;color:var(--muted);margin-top:8px;min-height:16px}
.findbar{padding:10px 14px;border-bottom:1px solid var(--line);display:none;gap:7px;align-items:center}
.findbar.show{display:flex}
.findbar .input{background:var(--panel)}
.findcount{font-size:11px;color:var(--muted);white-space:nowrap}
.toast{
  position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);
  background:#111;color:#fff;padding:10px 14px;border-radius:999px;font-size:12px;font-weight:700;
  opacity:0;pointer-events:none;transition:.2s;z-index:20
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
kbd{font:inherit;border:1px solid var(--line);background:var(--panel2);border-radius:5px;padding:1px 5px;font-size:10px;color:var(--muted)}
.footer{color:var(--muted);font-size:11px;text-align:center;margin-top:16px}
@media(max-width:900px){
  .grid{grid-template-columns:1fr}
  #editor{min-height:46vh}
  .side{display:grid;grid-template-columns:1fr 1fr}
}
@media(max-width:640px){
  .app{padding:12px 10px 34px}
  .header{align-items:flex-start}
  .header-actions .btn span{display:none}
  .side{display:flex}
  .stats{grid-template-columns:repeat(3,1fr)}
  .tools{grid-template-columns:1fr 1fr}
  .rule{grid-template-columns:1fr 22px 1fr 30px}
  #editor{padding:14px;font-size:16px;min-height:52vh}
}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="brand">
      <h1>文章整形ツール</h1>
      <p>文章はブラウザ内だけで処理され、外部へ送信されません。</p>
    </div>
    <div class="header-actions">
      <button class="btn" id="undoBtn">↶ <span>元に戻す</span></button>
      <button class="btn" id="redoBtn">↷ <span>やり直す</span></button>
      <button class="btn" id="copyBtn">コピー</button>
    </div>
  </div>

  <div class="grid">
    <section class="card editor-card">
      <div class="editor-top">
        <strong>テキスト</strong>
        <div class="editor-tools">
          <button class="btn" id="findToggle">検索</button>
          <button class="btn" id="downloadBtn">TXT保存</button>
          <button class="btn danger" id="clearBtn">クリア</button>
        </div>
      </div>
      <div class="findbar" id="findbar">
        <input class="input" id="findInput" placeholder="検索する文字">
        <span class="findcount" id="findCount">0件</span>
        <button class="btn" id="findPrev">↑</button>
        <button class="btn" id="findNext">↓</button>
      </div>
      <textarea id="editor" placeholder="ここに文章を貼り付けてください。&#10;&#10;右側のツールを押すと、文章をその場で整形できます。"></textarea>
      <div class="stats">
        <div class="stat"><b id="sChars">0</b><span>文字</span></div>
        <div class="stat"><b id="sNoSpace">0</b><span>空白除外</span></div>
        <div class="stat"><b id="sLines">0</b><span>行</span></div>
        <div class="stat"><b id="sParagraphs">0</b><span>段落</span></div>
        <div class="stat"><b id="sBytes">0</b><span>UTF-8 byte</span></div>
        <div class="stat"><b id="sRead">0分</b><span>読了目安</span></div>
      </div>
    </section>

    <aside class="side">
      <section class="card section">
        <h2>改行・空白</h2>
        <div class="tools">
          <button class="tool" data-action="removeBlank">空白行を削除<small>空行をすべて除去</small></button>
          <button class="tool" data-action="limitBlank">空白行を1行に<small>連続空行を整理</small></button>
          <button class="tool" data-action="trimLines">行頭・行末を削除<small>各行の余計な空白</small></button>
          <button class="tool" data-action="collapseSpaces">連続空白を1つに<small>半角/全角空白を整理</small></button>
          <button class="tool" data-action="tabsToSpaces">タブ→空白<small>タブを半角空白へ</small></button>
          <button class="tool" data-action="joinLines">改行を削除<small>全行を1行につなぐ</small></button>
          <button class="tool" data-action="spaceHalf">全角空白→半角<small>　をスペースへ</small></button>
          <button class="tool" data-action="spaceFull">半角空白→全角<small>スペースを　へ</small></button>
        </div>
      </section>

      <section class="card section">
        <h2>行単位</h2>
        <div class="tools">
          <button class="tool" data-action="dedupeLines">重複行を削除<small>最初の1行だけ残す</small></button>
          <button class="tool" data-action="removeEmptyEnds">前後の空行を削除<small>文章先頭・末尾のみ</small></button>
          <button class="tool" data-action="sortAsc">昇順に並べ替え<small>行を文字列順に整列</small></button>
          <button class="tool" data-action="sortDesc">降順に並べ替え<small>行を逆順に整列</small></button>
          <button class="tool" data-action="reverseLines">行順を反転<small>一番下から並べる</small></button>
          <button class="tool" data-action="numberLines">行番号を付ける<small>1. 2. 3. …</small></button>
        </div>
      </section>

      <section class="card section">
        <h2>日本語向け</h2>
        <div class="tools">
          <button class="tool" data-action="normalizePunct">句読点を統一<small>，．→、。</small></button>
          <button class="tool" data-action="normalizeDots">三点リーダー整理<small>... / ・・・ → ……</small></button>
          <button class="tool" data-action="normalizeWave">波線を統一<small>〜 / ～ を「〜」へ</small></button>
          <button class="tool" data-action="fullToHalfDigits">数字を半角化<small>０１２→012</small></button>
          <button class="tool" data-action="halfToFullDigits">数字を全角化<small>012→０１２</small></button>
          <button class="tool" data-action="normalizeNewline">改行コード統一<small>CRLF/CR→LF</small></button>
        </div>
      </section>

      <section class="card section">
        <h2>一括置換</h2>
        <div class="replace-list" id="replaceList"></div>
        <div class="options">
          <label class="check"><input type="checkbox" id="regexMode"> 正規表現</label>
          <label class="check"><input type="checkbox" id="caseSensitive"> 大文字小文字を区別</label>
        </div>
        <div class="replace-actions">
          <button class="btn" id="addRule">＋ 条件追加</button>
          <button class="btn primary" id="replaceAll">すべて置換</button>
        </div>
        <div class="notice" id="replaceNotice"></div>
      </section>
    </aside>
  </div>
  <div class="footer">ショートカット: <kbd>Ctrl / ⌘ + Z</kbd> 元に戻す　 <kbd>Ctrl / ⌘ + Shift + Z</kbd> やり直す　 <kbd>Ctrl / ⌘ + F</kbd> 検索</div>
</div>
<div class="toast" id="toast"></div>

<script>
(() => {
  const palettes = [
    {c:'#5B8DEF', s:'rgba(91,141,239,.16)', t:'#fff'},
    {c:'#8B5CF6', s:'rgba(139,92,246,.16)', t:'#fff'},
    {c:'#EC4899', s:'rgba(236,72,153,.15)', t:'#fff'},
    {c:'#F97316', s:'rgba(249,115,22,.16)', t:'#fff'},
    {c:'#14B8A6', s:'rgba(20,184,166,.16)', t:'#fff'},
    {c:'#22C55E', s:'rgba(34,197,94,.16)', t:'#fff'},
    {c:'#EAB308', s:'rgba(234,179,8,.18)', t:'#17181a'},
    {c:'#06B6D4', s:'rgba(6,182,212,.16)', t:'#fff'},
    {c:'#EF4444', s:'rgba(239,68,68,.15)', t:'#fff'}
  ];
  const pick = palettes[Math.floor(Math.random() * palettes.length)];
  const root = document.documentElement.style;
  root.setProperty('--accentColor', pick.c);
  root.setProperty('--accentSoft', pick.s);
  root.setProperty('--accentText', pick.t);

  const editor = document.getElementById('editor');
  const toast = document.getElementById('toast');
  const enc = new TextEncoder();

  const history = [''];
  let historyIndex = 0;
  let historyTimer = null;
  let ignoreHistory = false;

  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(showToast.t);
    showToast.t = setTimeout(() => toast.classList.remove('show'), 1400);
  }

  function updateStats(){
    const t = editor.value;
    document.getElementById('sChars').textContent = [...t].length.toLocaleString('ja-JP');
    document.getElementById('sNoSpace').textContent = [...t.replace(/\s/g,'')].length.toLocaleString('ja-JP');
    document.getElementById('sLines').textContent = (t ? t.split(/\r\n?|\n/).length : 0).toLocaleString('ja-JP');
    document.getElementById('sParagraphs').textContent =
      (t.trim() ? t.trim().split(/\n\s*\n/).filter(Boolean).length : 0).toLocaleString('ja-JP');
    document.getElementById('sBytes').textContent = enc.encode(t).length.toLocaleString('ja-JP');
    const chars = t.replace(/\s/g,'').length;
    document.getElementById('sRead').textContent = chars ? Math.max(1, Math.ceil(chars/500)) + '分' : '0分';
    updateFindCount();
    updateUndoRedo();
  }

  function commitHistory(value = editor.value){
    if(ignoreHistory) return;
    if(history[historyIndex] === value) return;
    history.splice(historyIndex + 1);
    history.push(value);
    if(history.length > 80) history.shift();
    historyIndex = history.length - 1;
    updateUndoRedo();
  }

  function scheduleHistory(){
    clearTimeout(historyTimer);
    historyTimer = setTimeout(() => commitHistory(), 350);
  }

  function setText(value, label){
    if(value === editor.value){
      showToast('変更はありません');
      return;
    }
    commitHistory(editor.value);
    ignoreHistory = true;
    editor.value = value;
    ignoreHistory = false;
    commitHistory(value);
    updateStats();
    if(label) showToast(label);
  }

  function undo(){
    clearTimeout(historyTimer);
    if(historyIndex <= 0) return;
    historyIndex--;
    ignoreHistory = true;
    editor.value = history[historyIndex];
    ignoreHistory = false;
    updateStats();
  }
  function redo(){
    clearTimeout(historyTimer);
    if(historyIndex >= history.length - 1) return;
    historyIndex++;
    ignoreHistory = true;
    editor.value = history[historyIndex];
    ignoreHistory = false;
    updateStats();
  }
  function updateUndoRedo(){
    document.getElementById('undoBtn').disabled = historyIndex <= 0;
    document.getElementById('redoBtn').disabled = historyIndex >= history.length - 1;
  }

  editor.addEventListener('input', () => { updateStats(); scheduleHistory(); });

  const actions = {
    removeBlank: t => t.split(/\r\n?|\n/).filter(line => line.trim() !== '').join('\n'),
    limitBlank: t => t.replace(/\r\n?/g,'\n').replace(/\n[ \t\u3000]*\n(?:[ \t\u3000]*\n)+/g,'\n\n'),
    trimLines: t => t.split(/\r\n?|\n/).map(x => x.trim()).join('\n'),
    collapseSpaces: t => t.replace(/[ \t\u3000]+/g,' '),
    tabsToSpaces: t => t.replace(/\t/g,' '),
    joinLines: t => t.replace(/\s*\r?\n\s*/g,''),
    spaceHalf: t => t.replace(/\u3000/g,' '),
    spaceFull: t => t.replace(/ /g,'\u3000'),
    dedupeLines: t => {
      const seen = new Set();
      return t.split(/\r\n?|\n/).filter(line => {
        if(seen.has(line)) return false;
        seen.add(line); return true;
      }).join('\n');
    },
    removeEmptyEnds: t => t.replace(/^(?:[ \t\u3000]*\r?\n)+|(?:\r?\n[ \t\u3000]*)+$/g,''),
    sortAsc: t => t.split(/\r\n?|\n/).sort((a,b)=>a.localeCompare(b,'ja')).join('\n'),
    sortDesc: t => t.split(/\r\n?|\n/).sort((a,b)=>b.localeCompare(a,'ja')).join('\n'),
    reverseLines: t => t.split(/\r\n?|\n/).reverse().join('\n'),
    numberLines: t => t.split(/\r\n?|\n/).map((x,i)=>`${i+1}. ${x}`).join('\n'),
    normalizePunct: t => t.replace(/，/g,'、').replace(/．/g,'。'),
    normalizeDots: t => t.replace(/(?:\.{3,}|・{3,}|…{1,})/g, m => '……'),
    normalizeWave: t => t.replace(/～/g,'〜'),
    fullToHalfDigits: t => t.replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0)-0xFEE0)),
    halfToFullDigits: t => t.replace(/[0-9]/g, c => String.fromCharCode(c.charCodeAt(0)+0xFEE0)),
    normalizeNewline: t => t.replace(/\r\n?/g,'\n')
  };

  document.querySelectorAll('[data-action]').forEach(btn => {
    btn.addEventListener('click', () => {
      const fn = actions[btn.dataset.action];
      setText(fn(editor.value), btn.firstChild.textContent.trim() + 'しました');
    });
  });

  document.getElementById('undoBtn').addEventListener('click', undo);
  document.getElementById('redoBtn').addEventListener('click', redo);

  document.getElementById('copyBtn').addEventListener('click', async () => {
    try{
      await navigator.clipboard.writeText(editor.value);
      showToast('コピーしました');
    }catch{
      editor.select();
      document.execCommand('copy');
      showToast('コピーしました');
    }
  });

  document.getElementById('clearBtn').addEventListener('click', () => {
    if(!editor.value) return;
    if(confirm('入力中の文章をすべて消しますか？')) setText('', 'クリアしました');
  });

  document.getElementById('downloadBtn').addEventListener('click', () => {
    const blob = new Blob([editor.value], {type:'text/plain;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'formatted-text.txt';
    a.click();
    setTimeout(()=>URL.revokeObjectURL(url), 1000);
  });

  // 一括置換
  const replaceList = document.getElementById('replaceList');
  function addRule(from='', to=''){
    const rule = document.createElement('div');
    rule.className = 'rule';
    rule.innerHTML = `
      <input class="input from" placeholder="置換前" value="">
      <span class="arrow">→</span>
      <input class="input to" placeholder="置換後" value="">
      <button class="iconbtn removeRule" title="削除">×</button>`;
    rule.querySelector('.from').value = from;
    rule.querySelector('.to').value = to;
    rule.querySelector('.removeRule').addEventListener('click', () => {
      if(replaceList.children.length === 1){
        rule.querySelector('.from').value = '';
        rule.querySelector('.to').value = '';
      }else rule.remove();
    });
    replaceList.appendChild(rule);
  }
  addRule();

  document.getElementById('addRule').addEventListener('click', () => addRule());

  function escapeRegExp(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }

  document.getElementById('replaceAll').addEventListener('click', () => {
    let text = editor.value;
    let total = 0;
    let used = 0;
    const regexMode = document.getElementById('regexMode').checked;
    const caseSensitive = document.getElementById('caseSensitive').checked;
    document.getElementById('replaceNotice').textContent = '';

    try{
      [...replaceList.querySelectorAll('.rule')].forEach(rule => {
        const from = rule.querySelector('.from').value;
        const to = rule.querySelector('.to').value;
        if(!from) return;
        used++;
        const source = regexMode ? from : escapeRegExp(from);
        const flags = 'g' + (caseSensitive ? '' : 'i');
        const re = new RegExp(source, flags);
        const matches = text.match(re);
        total += matches ? matches.length : 0;
        text = text.replace(re, to);
      });
      if(!used){
        document.getElementById('replaceNotice').textContent = '置換条件を入力してください。';
        return;
      }
      setText(text, `${total}件置換しました`);
      document.getElementById('replaceNotice').textContent = `${used}条件・${total}件を置換しました。`;
    }catch(e){
      document.getElementById('replaceNotice').textContent = '正規表現に誤りがあります: ' + e.message;
    }
  });

  // 検索
  const findbar = document.getElementById('findbar');
  const findInput = document.getElementById('findInput');
  const findCount = document.getElementById('findCount');
  let findPositions = [];
  let findIndex = -1;

  document.getElementById('findToggle').addEventListener('click', () => {
    findbar.classList.toggle('show');
    if(findbar.classList.contains('show')) setTimeout(()=>findInput.focus(),50);
  });

  function updateFindCount(){
    const q = findInput.value;
    findPositions = [];
    findIndex = -1;
    if(!q){ findCount.textContent='0件'; return; }
    const lower = editor.value.toLocaleLowerCase('ja');
    const needle = q.toLocaleLowerCase('ja');
    let pos = 0;
    while((pos = lower.indexOf(needle,pos)) !== -1){
      findPositions.push(pos);
      pos += Math.max(needle.length,1);
      if(findPositions.length > 10000) break;
    }
    findCount.textContent = findPositions.length.toLocaleString('ja-JP') + '件';
  }
  findInput.addEventListener('input', updateFindCount);

  function jumpFind(dir){
    if(!findPositions.length) return;
    findIndex = (findIndex + dir + findPositions.length) % findPositions.length;
    const pos = findPositions[findIndex];
    editor.focus();
    editor.setSelectionRange(pos, pos + findInput.value.length);
    findCount.textContent = `${findIndex+1}/${findPositions.length}`;
  }
  document.getElementById('findNext').addEventListener('click',()=>jumpFind(1));
  document.getElementById('findPrev').addEventListener('click',()=>jumpFind(-1));
  findInput.addEventListener('keydown',e=>{ if(e.key==='Enter'){e.preventDefault();jumpFind(e.shiftKey?-1:1);} });

  document.addEventListener('keydown', e => {
    const mod = e.ctrlKey || e.metaKey;
    if(mod && e.key.toLowerCase()==='f'){
      e.preventDefault(); findbar.classList.add('show'); findInput.focus(); findInput.select();
    } else if(mod && e.key.toLowerCase()==='z'){
      e.preventDefault();
      if(e.shiftKey) redo(); else undo();
    } else if(mod && e.key.toLowerCase()==='y'){
      e.preventDefault(); redo();
    }
  });

  updateStats();
})();
</script>
</body>
</html>
